name: docker-ctf-practice
x-safe: &safe
  user: "10001:10001"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 64m
  cpus: 0.25
  pids_limit: 16
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 1m, max-file: "2"}
services:
  files:
    <<: *safe
    image: docker-ctf/intro-files:session
  logs:
    <<: *safe
    image: docker-ctf/intro-logs:session
  environment:
    <<: *safe
    image: docker-ctf/intro-environment:session
